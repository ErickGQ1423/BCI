; LabRecorder configuration for the CNV pilot.
;
; This file keeps new XDF recordings under the same study root used by the
; online decoder logs:
;
;   /home/lab-admin/Documents/CNVStudy
;
; With BIDS enabled in LabRecorder, the resulting files should be saved as:
;
;   StudyRoot/sub-%p/ses-%s/eeg/sub-%p_ses-%s_task-%b_run-%r_eeg.xdf

StudyRoot=/home/lab-admin/Documents/CNVStudy

; Keep LabRecorder remote-control socket available for future automation.
RCSEnabled=1
RCSPort=22345
